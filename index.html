<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Style For You • Curated Weekly Drops</title>
  <meta name="theme-color" content="#FAF8F5" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF8F5; --sand: #F3EFEA; --ink: #1E1B18; --muted: #6E655F;
      --terra: #B85D3B; --wa: #25D366; --partner: #2B5B84;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #EAE5DF; color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; justify-content: center; min-height: 100vh;
    }
    .app {
      width: 100%; max-width: 440px; background: var(--cream); min-height: 100vh;
      display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative;
    }
    header {
      position: sticky; top: 0; z-index: 20; background: rgba(250,248,245,0.96);
      backdrop-filter: blur(8px); border-bottom: 1px solid rgba(30,27,24,0.1); padding: 12px 16px 10px;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .brand h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; line-height: 1; }
    .brand p { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--terra); margin-top: 4px; }
    .icon-btns { display: flex; gap: 8px; }
    .circle-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(30,27,24,0.12);
      background: var(--sand); color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; font-size: 16px; touch-action: manipulation;
    }
    .circle-btn.dark { background: var(--ink); color: var(--cream); border: none; }
    .badge-dot {
      position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--terra); color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .search-box { margin-top: 10px; position: relative; }
    .search-box input {
      width: 100%; background: #fff; border: 1px solid rgba(30,27,24,0.12); border-radius: 99px;
      padding: 8px 14px 8px 34px; font-size: 12px; outline: none;
    }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .tab {
      padding: 6px 4px; border-radius: 99px; font-size: 11px; font-weight: 600;
      background: #fff; color: var(--ink); border: 1px solid rgba(30,27,24,0.12); cursor: pointer; touch-action: manipulation;
    }
    .tab.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .tab.partner-tab { color: var(--partner); border-color: rgba(43,91,132,0.3); }
    .tab.partner-tab.active { background: var(--partner); color: #fff; border-color: var(--partner); }
    .pills { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap;
      background: #fff; color: var(--muted); border: 1px solid rgba(30,27,24,0.1); cursor: pointer; touch-action: manipulation;
    }
    .pill.active { background: var(--terra); color: #fff; border-color: var(--terra); }
    main { flex: 1; padding: 14px 16px 90px; }
    .banner {
      background: linear-gradient(135deg, #EFE6DD, #F7F1EB); border: 1px solid rgba(184,93,59,0.2);
      border-radius: 16px; padding: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .banner-tag { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--terra); background: #fff; padding: 2px 8px; border-radius: 99px; margin-bottom: 4px; }
    .banner h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.15; }
    .banner p { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .count-pill { background: #fff; border: 1px solid rgba(30,27,24,0.1); border-radius: 10px; padding: 5px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid rgba(30,27,24,0.1);
      display: flex; flex-direction: column; cursor: pointer;
    }
    .card.partner { border-color: rgba(43,91,132,0.3); }
    .card-img { position: relative; aspect-ratio: 4/5; background: var(--sand); }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tag-top {
      position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 99px;
      font-size: 9px; font-weight: 700; text-transform: uppercase; background: var(--terra); color: #fff;
    }
    .tag-top.partner { background: var(--partner); }
    .tag-top.sold { background: var(--ink); }
    .photo-count-badge {
      position: absolute; top: 8px; right: 8px; background: rgba(30,27,24,0.8); color: #fff;
      font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 99px;
    }
    .tag-bot {
      position: absolute; bottom: 8px; left: 8px; background: rgba(255,255,255,0.92);
      padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 600;
    }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; line-height: 1.2; }
    .card-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .card-foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(30,27,24,0.06); display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 13px; font-weight: 700; }
    .cta-txt { font-size: 11px; font-weight: 700; color: var(--terra); }
    .cta-txt.partner { color: var(--partner); }
    footer { border-top: 1px solid rgba(30,27,24,0.1); background: var(--sand); padding: 14px; text-align: center; font-size: 11px; color: var(--muted); }
    .float-bar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 408px;
      background: var(--ink); color: var(--cream); border-radius: 16px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 25; cursor: pointer;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-bg.center { align-items: center; padding: 16px; }
    .sheet {
      background: var(--cream); width: 100%; max-width: 440px; border-radius: 24px 24px 0 0;
      max-height: 92vh; overflow-y: auto; position: relative;
    }
    .box { background: var(--cream); width: 100%; max-width: 340px; border-radius: 22px; padding: 20px; text-align: center; }
    .hidden { display: none !important; }
    .btn {
      padding: 11px 14px; border-radius: 12px; font-size: 12px; font-weight: 700;
      border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-dark { background: var(--ink); color: var(--cream); }
    .btn-outline { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
    .btn-wa { background: var(--wa); color: #fff; }
    .btn-partner { background: var(--partner); color: #fff; width: 100%; }
    .btn-terra { background: var(--terra); color: #fff; }
    .input {
      width: 100%; background: #fff; border: 1px solid rgba(30,27,24,0.16); border-radius: 10px;
      padding: 9px 12px; font-size: 12px; margin-top: 6px;
    }
    .size-chip {
      padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700;
      border: 1px solid rgba(30,27,24,0.2); background: #fff; cursor: pointer;
    }
    .size-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .gal-nav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px;
      border-radius: 50%; border: none; background: rgba(255,255,255,0.9); color: var(--ink);
      font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .gal-counter {
      position: absolute; bottom: 10px; right: 12px; background: rgba(30,27,24,0.8);
      color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
    }
    .thumb-strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: none;
    }
    .thumb-strip::-webkit-scrollbar { display: none; }
    .thumb {
      width: 46px; height: 54px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
      border: 2px solid transparent; opacity: 0.6; cursor: pointer;
    }
    .thumb.active { border-color: var(--terra); opacity: 1; }
